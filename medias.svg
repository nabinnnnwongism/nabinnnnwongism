<svg xmlns="http://www.w3.org/2000/svg" width="480" height="920" viewBox="0 0 480 920" role="img" aria-label="Media &amp; Cultural Curations">
  <defs>
    <linearGradient id="mediaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f778ba"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3b341"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    .card { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; color: #c9d1d9; }
    .title { font-size: 15px; font-weight: 600; fill: #f778ba; }
    .section-title { font-size: 13px; font-weight: 600; fill: #58a6ff; }
    .desc { font-size: 11.5px; fill: #8b949e; line-height: 1.4; }
    .label { font-size: 12px; fill: #c9d1d9; font-weight: 600; }
    .muted { font-size: 11px; fill: #8b949e; }
    .quote { font-style: italic; font-size: 11px; fill: #8b949e; }
    .icon { fill: #8b949e; }
    .icon-pink { fill: #f778ba; }
    .icon-blue { fill: #58a6ff; }
    .icon-gold { fill: #e3b341; }
    .media-box { fill: #161b22; stroke: #21262d; stroke-width: 1px; rx: 6px; }
    .pill { rx: 4px; fill: #21262d; font-size: 9.5px; font-weight: 500; }
    .char-badge { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 6px; }
  </style>

  <rect width="478" height="918" x="1" y="1" class="bg"/>

  <!-- HEADER: ANILIST & MEDIA CURATIONS -->
  <g transform="translate(24, 28)">
    <svg width="18" height="18" viewBox="0 0 16 16" class="icon-pink">
      <path fill-rule="evenodd" d="M4.75 2.5a.25.25 0 00-.25.25v9.91l3.023-2.489a.75.75 0 01.954 0l3.023 2.49V2.75a.25.25 0 00-.25-.25h-6.5zM3 2.75C3 1.784 3.784 1 4.75 1h6.5c.966 0 1.75.784 1.75 1.75v11.5a.75.75 0 01-1.227.579L8 11.722l-3.773 3.107A.75.75 0 013 14.25V2.75z"/>
    </svg>
    <text x="26" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="15" font-weight="600" fill="url(#mediaGrad)">Media, Literary &amp; Anime Curations</text>
    <text x="0" y="36" class="desc">Genres: Psychological &#xB7; Epic Sci-Fi &#xB7; Strategy &#xB7; Dark Mythos &#xB7; Noir</text>
  </g>

  <!-- LINE -->
  <line x1="24" y1="78" x2="456" y2="78" stroke="#21262d" stroke-width="1"/>

  <!-- ANIME MASTERPIECES -->
  <g transform="translate(24, 96)">
    <svg width="15" height="15" viewBox="0 0 16 16" class="icon-blue">
      <path fill-rule="evenodd" d="M1.75 2.5a.25.25 0 00-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 00.25-.25V2.75a.25.25 0 00-.25-.25H1.75zM0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0114.25 16H1.75A1.75 1.75 0 010 14.25V2.75zM8 4.75a.75.75 0 01.75.75v2.25H11a.75.75 0 010 1.5H8.75v2.25a.75.75 0 01-1.5 0V9.25H5a.75.75 0 010-1.5h2.25V5.5A.75.75 0 018 4.75z"/>
    </svg>
    <text x="22" y="12" class="section-title">Top Anime &amp; Masterpiece Series</text>

    <!-- ENTRY 1: Legend of the Galactic Heroes -->
    <g transform="translate(0, 26)">
      <rect width="432" height="96" class="media-box"/>
      <g transform="translate(14, 16)">
        <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="13" font-weight="600" fill="#79c0ff">&#x1F680; Legend of the Galactic Heroes</text>
        <rect x="220" y="-3" width="50" height="15" rx="7.5" fill="#f0883e" fill-opacity="0.2"/>
        <text x="245" y="8" text-anchor="middle" font-size="9" font-weight="600" fill="#ffa657">&#x2605; 9.4/10</text>
        <text x="278" y="8" font-size="10" fill="#8b949e">&#xB7; 110 Episodes &#xB7; OVA</text>
        <text x="0" y="28" class="desc">Ginga Eiy&#x16B; Densetsu &#xB7; Galactic strategy, grand politics &amp; philosophical conflict.</text>
        <text x="0" y="46" class="quote">"In every age, in every place, the deeds of men remain the same."</text>
        <text x="0" y="64" class="muted" fill="#bc8cff">&#x2726; Focus: Reinhard von Lohengramm vs. Yang Wen-li</text>
      </g>
    </g>

    <!-- ENTRY 2: Sekiro: Shadows Die Twice -->
    <g transform="translate(0, 130)">
      <rect width="432" height="96" class="media-box"/>
      <g transform="translate(14, 16)">
        <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="13" font-weight="600" fill="#f85149">&#x2694;&#xFE0F; Sekiro: Shadows Die Twice</text>
        <rect x="200" y="-3" width="58" height="15" rx="7.5" fill="#f85149" fill-opacity="0.2"/>
        <text x="229" y="8" text-anchor="middle" font-size="9" font-weight="600" fill="#ff7b72">GOTY &#xB7; Master</text>
        <text x="266" y="8" font-size="10" fill="#8b949e">&#xB7; Sengoku Mythos</text>
        <text x="0" y="28" class="desc">A masterwork in rhythm, discipline, and swordplay. Deflection over brute force.</text>
        <text x="0" y="46" class="quote">"Hesitation is defeat." &#x2014; Isshin, the Sword Saint</text>
        <text x="0" y="64" class="muted" fill="#e3b341">&#x2726; Themes: Immortality, loyalty, and the shinobi code</text>
      </g>
    </g>
  </g>

  <!-- LINE -->
  <line x1="24" y1="340" x2="456" y2="340" stroke="#21262d" stroke-width="1"/>

  <!-- FAVORITE CHARACTERS GRID (10 CHARACTERS) -->
  <g transform="translate(24, 356)">
    <svg width="15" height="15" viewBox="0 0 16 16" class="icon-pink">
      <path fill-rule="evenodd" d="M12 5a3 3 0 11-6 0 3 3 0 016 0zm-9 8c0-1.657 3.134-3 7-3s7 1.343 7 3a1 1 0 01-1 1H4a1 1 0 01-1-1z"/>
    </svg>
    <text x="22" y="12" class="section-title">Hall of Icons &#xB7; 10 Definitive Characters</text>

    <!-- ROW 1 -->
    <g transform="translate(0, 26)">
      <!-- Ada Wong -->
      <g transform="translate(0, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#a40e26"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">AW</text>
        <text x="46" y="20" class="label">Ada Wong</text>
        <text x="46" y="36" class="muted">Resident Evil &#xB7; Operative</text>
      </g>

      <!-- Spider-Man -->
      <g transform="translate(222, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#b91c1c"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">SM</text>
        <text x="46" y="20" class="label">Spider-Man</text>
        <text x="46" y="36" class="muted">Peter Parker &#xB7; Marvel</text>
      </g>
    </g>

    <!-- ROW 2 -->
    <g transform="translate(0, 80)">
      <!-- Leon S. Kennedy -->
      <g transform="translate(0, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#1e3a8a"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">LK</text>
        <text x="46" y="20" class="label">Leon S. Kennedy</text>
        <text x="46" y="36" class="muted">Resident Evil &#xB7; Agent</text>
      </g>

      <!-- Sensei -->
      <g transform="translate(222, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#3f3f46"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">NS</text>
        <text x="46" y="20" class="label">Sensei</text>
        <text x="46" y="36" class="muted">Kokoro (Natsume S&#x14D;seki)</text>
      </g>
    </g>

    <!-- ROW 3 -->
    <g transform="translate(0, 134)">
      <!-- Goku -->
      <g transform="translate(0, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#c2410c"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">GK</text>
        <text x="46" y="20" class="label">Son Goku</text>
        <text x="46" y="36" class="muted">Dragon Ball &#xB7; Saiyan</text>
      </g>

      <!-- Judge Holden -->
      <g transform="translate(222, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#4b5563"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">JH</text>
        <text x="46" y="20" class="label">Judge Holden</text>
        <text x="46" y="36" class="muted">Blood Meridian (McCarthy)</text>
      </g>
    </g>

    <!-- ROW 4 -->
    <g transform="translate(0, 188)">
      <!-- Reinhard von Lohengramm -->
      <g transform="translate(0, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#854d0e"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">RL</text>
        <text x="46" y="20" class="label">Reinhard v. Lohengramm</text>
        <text x="46" y="36" class="muted">Galactic Empire &#xB7; Kaiser</text>
      </g>

      <!-- Franz Kafka -->
      <g transform="translate(222, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#18181b"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FK</text>
        <text x="46" y="20" class="label">Franz Kafka</text>
        <text x="46" y="36" class="muted">The Trial / Metamorphosis</text>
      </g>
    </g>

    <!-- ROW 5 -->
    <g transform="translate(0, 242)">
      <!-- Klein Moretti -->
      <g transform="translate(0, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#4c1d95"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">KM</text>
        <text x="46" y="20" class="label">Klein Moretti (The Fool)</text>
        <text x="46" y="36" class="muted">Lord of the Mysteries</text>
      </g>

      <!-- Jamyang -->
      <g transform="translate(222, 0)">
        <rect width="210" height="48" class="char-badge"/>
        <circle cx="24" cy="24" r="14" fill="#065f46"/>
        <text x="24" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">JY</text>
        <text x="46" y="20" class="label">Jamyang</text>
        <text x="46" y="36" class="muted">Manjushri &#xB7; Discernment</text>
      </g>
    </g>
  </g>

  <!-- LINE -->
  <line x1="24" y1="672" x2="456" y2="672" stroke="#21262d" stroke-width="1"/>

  <!-- AUDIO CONSOLE / SUGGESTED TRACKS -->
  <g transform="translate(24, 690)">
    <svg width="15" height="15" viewBox="0 0 16 16" class="icon-blue">
      <path fill-rule="evenodd" d="M12 3a1 1 0 00-1-1H5a1 1 0 00-1 1v7.268a2 2 0 101.5 1.932V5.5h5v4.768a2 2 0 101.5 1.932V3z"/>
    </svg>
    <text x="22" y="12" class="section-title">Acoustic Telemetry &#xB7; Heavy Rotation</text>

    <g transform="translate(0, 26)">
      <!-- Track 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" font-size="12" font-weight="600" fill="#c9d1d9">&#x25B6; Mahler: Symphony No. 3 in D Minor</text>
        <text x="14" y="28" class="muted">Vienna Philharmonic &#xB7; Galactic Heroes Grand Theme</text>
      </g>

      <!-- Track 2 -->
      <g transform="translate(0, 38)">
        <text x="0" y="12" font-size="12" font-weight="600" fill="#c9d1d9">&#x25B6; Emma, The Gentle Blade</text>
        <text x="14" y="28" class="muted">Yuka Kitamura &#xB7; Sekiro: Shadows Die Twice OST</text>
      </g>

      <!-- Track 3 -->
      <g transform="translate(0, 76)">
        <text x="0" y="12" font-size="12" font-weight="600" fill="#c9d1d9">&#x25B6; The Prowler (Spider-Verse)</text>
        <text x="14" y="28" class="muted">Daniel Pemberton &#xB7; Into the Spider-Verse</text>
      </g>

      <!-- Track 4 -->
      <g transform="translate(0, 114)">
        <text x="0" y="12" font-size="12" font-weight="600" fill="#c9d1d9">&#x25B6; Nocturne in C Minor, Op. 48 No. 1</text>
        <text x="14" y="28" class="muted">Fr&#xE9;d&#xE9;ric Chopin &#xB7; Classical Virtuosity</text>
      </g>

      <!-- Track 5 -->
      <g transform="translate(0, 152)">
        <text x="0" y="12" font-size="12" font-weight="600" fill="#c9d1d9">&#x25B6; The Only Thing They Fear Is You</text>
        <text x="14" y="28" class="muted">Mick Gordon &#xB7; Industrial Precision</text>
      </g>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(24, 896)">
    <text x="0" y="0" font-size="9.5" fill="#484f58">&#x1F3A8; Curated cultural &amp; literary index &#xB7; aesthetic perfection</text>
  </g>
</svg>