<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Philosophical Maxim">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  <style>
    .kanji { font-family: 'Hiragino Mincho Pro', 'Yu Mincho', serif; font-size: 54px; fill: #ffffff; fill-opacity: 0.05; }
    .headline { font-family: 'Impact', -apple-system, 'Segoe UI', sans-serif; font-size: 26px; letter-spacing: 2px; fill: url(#textGrad); }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', serif; font-size: 13.5px; fill: #8b949e; letter-spacing: 0.5px; font-style: italic; }
    .quote-author { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #58a6ff; font-weight: 600; }
  </style>

  <!-- Watermark Kanji: 迷えば、敗れる (Hesitation is defeat) -->
  <text x="20" y="95" class="kanji">&#x8FF7;&#x3048;&#x3070;&#x3001;&#x6557;&#x308c;&#x308b;</text>

  <!-- Content (NO border, NO lines, NO background rect) -->
  <g transform="translate(10, 30)">
    <text x="0" y="24" class="headline">&#x201C;HESITATION IS DEFEAT. BUT INGENUITY IS ETERNAL.&#x201D;</text>
    <text x="0" y="54" class="subtext">&#x201C;There are few things as tragic as a victory won by deception, except a defeat suffered through incompetence.&#x201D;</text>
    
    <g transform="translate(0, 84)">
      <circle cx="4" cy="5" r="3.5" fill="#58a6ff"/>
      <text x="14" y="9" class="quote-author">REINHARD VON LOHENGRAMM &#xB7; ISSHIN ASHINA &#xB7; FRANZ KAFKA</text>
      <text x="500" y="9" font-family="-apple-system, BlinkMacSystemFont" font-size="11" fill="#484f58">&#x2014; Engineered by nabinnnnwongism</text>
    </g>
  </g>
</svg>